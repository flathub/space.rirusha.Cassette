id: space.rirusha.Cassette
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: cassette
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
modules:
  - name: cassette
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://gitlab.gnome.org/Rirusha/Cassette.git
        tag: v0.2.1.g49
        commit: 2672bf3253523980bab77ba16e47b0d3f9efdb55
        x-checker-data:
          tag-pattern: ^v([\d.]+)$
          type: git
