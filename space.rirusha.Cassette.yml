id: space.rirusha.Cassette
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: cassette
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
modules:
  - name: cassette
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://gitlab.gnome.org/Rirusha/Cassette.git
        tag: v0.2.1
        commit: 6dec1c9403a67fd9482d6798f3a9f2c89909b4e8
        x-checker-data:
          tag-pattern: ^v([\d.]+)$
          type: git
