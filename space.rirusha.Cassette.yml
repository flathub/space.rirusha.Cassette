id: space.rirusha.Cassette
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: cassette
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
modules:
  - name: cassette
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/rirusha/Cassette.git
        tag: v0.2.4
        commit: 9d34251d01bcd414ffbec2bef7931090d33c9124
        x-checker-data:
          tag-pattern: ^v(\d+\.\d+\.\d+)$
          type: git
